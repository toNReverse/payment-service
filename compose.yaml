# Local development stack: `docker compose up --build`.
# The database credentials below exist only inside this local stack; they are not secrets.
# Ports are bound to 127.0.0.1 so nothing is reachable from the local network.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/payments
      DATABASE_USER: payments
      DATABASE_PASSWORD: payments
      REDIS_URL: redis://redis:6379
      # Read from .env when present (compose substitutes ${...} from it); empty means the fake gateway.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
